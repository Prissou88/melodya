<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#130e21"><title>MÉLODYA • Musique indépendante</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#f8f4ff;background:#100d19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#32204c,#100d19 60%);min-height:100vh}header{max-width:1050px;margin:auto;padding:22px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:850;letter-spacing:2px}.brand span{color:#bc8afc}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;color:white;background:#382b50}button:hover{background:#50376d}button.primary{background:#9858ed;color:#fff;font-weight:700}button:disabled{opacity:.4;cursor:default}.layout{max-width:1050px;margin:auto;padding:0 16px 130px;display:grid;grid-template-columns:210px 1fr;gap:20px}.side,.panel{background:#1b1529;border:1px solid #3c2c52;border-radius:19px;padding:16px}.side{align-self:start;display:grid;gap:7px}.side button{text-align:left;background:transparent}.side button.active{background:#58387d}.panel{min-height:480px}.hero{border-radius:18px;background:linear-gradient(110deg,#7040b1,#261b41);padding:26px;margin-bottom:20px}h1{font-size:28px;margin:0 0 8px}h2{font-size:21px;margin:8px 0 15px}p{color:#c9bdd8;line-height:1.5}.tag{font-size:12px;color:#d9c4f2}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#282038;border-radius:14px;padding:16px}.cover{height:115px;background:linear-gradient(135deg,#563180,#c264c6);display:grid;place-items:center;font-size:46px;border-radius:12px;margin-bottom:12px}.title{font-weight:750}.muted{color:#b9a9cd;font-size:13px}.track{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #3c2c52}.track .details{flex:1;min-width:0}.track button{padding:8px 11px}.pill{display:inline-block;border-radius:50px;padding:5px 10px;background:#3d2b56;color:#e6d6fa;font-size:12px}.player{position:fixed;bottom:0;left:0;right:0;background:#20182f;border-top:1px solid #644784;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;z-index:10}.player strong{min-width:150px}.player audio{max-width:360px;width:100%;height:36px}input[type=text],input[type=file],textarea{width:100%;padding:12px;border:1px solid #604775;border-radius:10px;background:#251b37;color:#fff;margin:7px 0 12px}label{display:block;margin-top:8px}.notice{background:#30223f;border-left:3px solid #c58bff;padding:13px;border-radius:8px;margin:14px 0}.status{font-size:12px;color:#e7c5ff}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:650px){.layout{display:block}.side{display:flex;overflow:auto;margin-bottom:12px;padding:8px}.side button{white-space:nowrap}.panel{padding:14px}.player{gap:8px}.player strong{min-width:0;font-size:12px}.player audio{width:calc(100% - 80px)}.brand{font-size:21px}}textarea{min-height:110px;resize:vertical}select{padding:11px;background:#251b37;color:white;border:1px solid #604775;border-radius:10px}.lyrics{white-space:pre-wrap;line-height:1.9;background:#2c2140;border-radius:14px;padding:18px;max-height:240px;overflow:auto}.badge{font-size:11px;background:#4b315d;padding:4px 8px;border-radius:30px}.switch{display:flex;align-items:center;gap:9px}.switch input{width:auto}.video{width:100%;max-height:350px;border-radius:12px;background:#09060e}.hint{font-size:12px;color:#d0b9e5}input[type=email],input[type=password]{width:100%;padding:12px;border:1px solid #604775;border-radius:10px;background:#251b37;color:white;margin:7px 0 12px}.stat{display:inline-block;margin:5px 6px 5px 0;padding:8px 11px;background:#322344;border-radius:10px;font-size:13px}.rank{color:#d5a5ff;font-weight:800;margin-right:8px}
</style></head><body><header><div class="brand">♫ MÉLO<span>DYA</span></div><span class="pill">En ligne · Gratuit · Sans pub</span></header><div class="layout"><nav class="side" id="nav"><button data-tab="home" class="active">⌂ Accueil</button><button data-tab="library">♫ Bibliothèque</button><button data-tab="top">🏆 Top 10</button><button data-tab="artist">♬ Studio artiste</button><button data-tab="admin">♛ Modération</button><button data-tab="about">ⓘ Projet</button><button data-tab="account">♙ Mon compte</button></nav><main class="panel" id="main"></main></div><footer class="player"><strong id="now">Aucune chanson</strong><button id="prev" title="Précédent">⏮</button><audio id="audio" controls preload="metadata"></audio><button id="next" title="Suivant">⏭</button></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const SUPABASE_URL='https://frxhpqdlpuhueilmqabc.supabase.co';
const SUPABASE_KEY='sb_publishable_rVGzwlJ1lMGbeiyg_55nPw_U_nK7z4Q';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const main=document.getElementById('main'),audio=document.getElementById('audio');
let tab='home',kids=false,search='',favorites=new Set(JSON.parse(localStorage.getItem('melodya-favs')||'[]')),songs=[],session=null,isAdmin=false,current=null;
let playCounts={},artistStats={},playedSeconds=0,lastPosition=null,countedSong=null,playGeneration=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=e=>alert(e?.message||String(e));
const visible=()=>songs.filter(s=>s.status==='approved'&&(!kids||s.kids));
const own=()=>songs.filter(s=>s.owner_id===session?.user?.id);
const statuses={pending:'En attente',approved:'Approuvée',rejected:'Refusée'};
const plays=id=>Number(playCounts[id]||0);
function list(rows,ranked=false){return rows.length?rows.map((s,i)=>`<div class="track"><div class="details"><div class="title">${ranked?`<span class="rank">#${i+1}</span>`:''}${esc(s.title)}</div><div class="muted">${esc(s.artist)} ${s.video_path?'· Clip':''} · 🎧 ${plays(s.id).toLocaleString('fr-FR')} écoute${plays(s.id)>1?'s':''}</div></div><button data-play="${esc(s.id)}">▶</button><button data-fav="${esc(s.id)}">${favorites.has(s.id)?'♥':'♡'}</button></div>`).join(''):'<p>Aucune chanson pour le moment.</p>'}
function statsFor(id){const st=artistStats[id]||{};return `<div class="muted"><span class="stat">🎧 Total : ${Number(st.total||0).toLocaleString('fr-FR')}</span><span class="stat">7 jours : ${Number(st.last_7_days||0).toLocaleString('fr-FR')}</span><span class="stat">30 jours : ${Number(st.last_30_days||0).toLocaleString('fr-FR')}</span></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const published=visible();const auth=session?`<span class="pill">${esc(session.user.email||'Connecté')}</span> <button id="logout">Déconnexion</button>`:`<button data-goto="account">Connexion / inscription</button>`;
if(tab==='home')main.innerHTML=`<section class="hero"><h1>Bienvenue sur MÉLODYA 💜</h1><p>Découvre les artistes indépendants. Gratuit et sans publicité.</p><button class="primary" data-goto="artist">Publier un titre</button></section><div class="actions">${auth}<button id="kid">${kids?'✓ Mode enfant':'♧ Mode enfant'}</button></div><h2>Découvrir</h2>${list(published)}<h2>🏆 Les plus écoutées</h2>${list([...published].sort((a,b)=>plays(b.id)-plays(a.id)).slice(0,10),true)}`;
else if(tab==='top')main.innerHTML=`<h1>🏆 Top 10 MÉLODYA</h1><p>Classement des chansons approuvées selon leurs écoutes.</p>${list([...published].sort((a,b)=>plays(b.id)-plays(a.id)).slice(0,10),true)}`;
else if(tab==='library')main.innerHTML=`<h1>Bibliothèque</h1><input type="text" id="search" placeholder="Rechercher titre ou artiste" value="${esc(search)}"><div class="actions"><button id="onlyFav">♥ Favoris</button><button id="allSongs">Tous les titres</button></div><div id="results">${list(published.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(search.toLowerCase())))}</div>`;
else if(tab==='account')main.innerHTML=session?`<h1>Mon compte</h1><p>${esc(session.user.email)}</p><button id="logout">Déconnexion</button>`:`<h1>Compte artiste</h1><p>Inscris-toi ou connecte-toi pour publier tes musiques.</p><form id="login"><label>Email<input type="email" name="email" required></label><label>Mot de passe<input type="password" name="password" minlength="6" required></label><div class="actions"><button class="primary" type="submit" name="action" value="signin">Connexion</button><button type="submit" name="action" value="signup">Créer mon compte</button></div></form><p class="hint">À l'inscription, vérifie tes emails si Supabase demande une confirmation.</p>`;
else if(tab==='artist')main.innerHTML=!session?`<h1>Studio artiste</h1><p>Connecte-toi pour envoyer tes titres et voir tes statistiques privées.</p><button class="primary" data-goto="account">Se connecter</button>`:`<h1>Studio artiste</h1><p>Envoie un titre pour validation. Maximum 50 Mo par fichier.</p><form id="upload"><label>Titre<input type="text" name="title" maxlength="100" required></label><label>Artiste<input type="text" name="artist" maxlength="100" required></label><label>Audio<input type="file" name="file" accept="audio/mp3,.m4a,.wav,.aac,.flac,.ogg,.aif,.aiff,audio/*" required></label><label>Clip facultatif<input type="file" name="video" accept="video/mp4,video/webm"></label><label>Paroles<textarea name="lyrics" maxlength="15000"></textarea></label><label class="switch"><input type="checkbox" name="kids">Convient aux enfants</label><label class="switch"><input type="checkbox" name="rights" required>Je possède les droits de diffusion.</label><button class="primary" type="submit">Envoyer à la modération</button></form><h2>Mes titres et statistiques 🔒</h2>${own().length?own().map(s=>`<div class="track"><div class="details"><strong>${esc(s.title)}</strong><div class="muted">${statuses[s.status]||esc(s.status)}</div>${statsFor(s.id)}</div><button data-delete="${esc(s.id)}">Supprimer</button></div>`).join(''):'<p>Aucune soumission.</p>'}`;
else if(tab==='admin')main.innerHTML=!isAdmin?'<h1>Modération</h1><p>Accès réservé à l’administration.</p>':`<h1>Modération ♛</h1><h2>En attente</h2>${songs.filter(s=>s.status==='pending').map(s=>`<div class="track"><div class="details"><strong>${esc(s.title)}</strong><div class="muted">${esc(s.artist)} ${s.kids?'· Déclaré enfant':''}</div></div><button data-review="${esc(s.id)}" data-decision="approved">✓</button><button data-review="${esc(s.id)}" data-decision="rejected">✕</button></div>`).join('')||'<p>Aucune attente.</p>'}<h2>Traités</h2>${songs.filter(s=>s.status!=='pending').map(s=>`<div class="track"><div class="details">${esc(s.title)} · ${statuses[s.status]||esc(s.status)}</div><button data-review="${esc(s.id)}" data-decision="pending">Réexaminer</button></div>`).join('')||'<p>Aucun.</p>'}`;
else main.innerHTML=`<h1>À propos de MÉLODYA</h1><p>Application musicale indépendante avec comptes artistes, publication modérée et stockage Supabase.</p><p>Les écoutes sont comptabilisées après 30 secondes de lecture réelle. Les statistiques des artistes sont privées.</p><p>Le mode enfant filtre les titres déclarés adaptés, mais ne remplace pas une véritable vérification de contenu ou un contrôle parental.</p>`;
}
async function loadCounts(){const {data,error}=await sb.rpc('melodya_play_counts');if(error){console.warn('Compteurs indisponibles',error);return}playCounts=Object.fromEntries((data||[]).map(x=>[x.song_id,Number(x.total)]))}
async function loadStats(){if(!session){artistStats={};return}const {data,error}=await sb.rpc('melodya_artist_stats');if(error){console.warn('Statistiques indisponibles',error);return}artistStats=Object.fromEntries((data||[]).map(x=>[x.song_id,x]))}
async function refresh(){const {data,error}=await sb.from('melodya_songs').select('*').order('created_at',{ascending:false}).limit(300);if(error)throw error;songs=data||[];await Promise.all([loadCounts(),loadStats()]);render()}
async function init(){try{const {data:{session:s}}=await sb.auth.getSession();session=s;if(session){const r=await sb.rpc('melodya_is_admin');isAdmin=r.data===true}await refresh()}catch(e){main.innerHTML=`<h1>Configuration nécessaire</h1><p>${esc(e.message)}</p><p>Vérifie la configuration Supabase de MÉLODYA.</p>`}}
async function signed(path){if(!path)return null;const {data,error}=await sb.storage.from('melodya-media').createSignedUrl(path,3600);if(error)throw error;return data.signedUrl}
function resetPlayback(){playedSeconds=0;lastPosition=null;countedSong=null;playGeneration++}
async function play(id){const s=visible().find(x=>x.id===id);if(!s)return;try{const generation=playGeneration+1;resetPlayback();const url=await signed(s.audio_path);if(generation!==playGeneration)return;audio.src=url;current=id;document.getElementById('now').textContent=s.title+' · '+s.artist;await audio.play();document.getElementById('extras')?.remove();if(s.lyrics||s.video_path){const block=document.createElement('section');block.id='extras';block.className='notice';block.innerHTML=`<h2>${esc(s.title)}</h2>${s.video_path?'<video class="video" id="clip" controls playsinline></video>':''}${s.lyrics?`<h3>Paroles</h3><div class="lyrics">${esc(s.lyrics)}</div>`:''}`;main.prepend(block);if(s.video_path)block.querySelector('video').src=await signed(s.video_path)}}catch(e){msg(e)}}
async function uploadFile(file,uid){if(!file?.size)return null;if(file.size>50*1024*1024)throw Error('Fichier trop volumineux (50 Mo maximum).');const ext=file.name.split('.').pop().toLowerCase();const path=`${uid}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('melodya-media').upload(path,file,{contentType:file.type||undefined,upsert:false});if(error)throw error;return path}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;search='';render()}});
main.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.goto){tab=b.dataset.goto;render()}else if(b.id==='logout'){await sb.auth.signOut();session=null;isAdmin=false;tab='home';await refresh()}else if(b.id==='kid'){kids=!kids;if(kids&&current&&!visible().some(s=>s.id===current)){audio.pause();audio.removeAttribute('src');current=null;resetPlayback()}render()}else if(b.dataset.play)await play(b.dataset.play);else if(b.dataset.fav){favorites.has(b.dataset.fav)?favorites.delete(b.dataset.fav):favorites.add(b.dataset.fav);localStorage.setItem('melodya-favs',JSON.stringify([...favorites]));render()}else if(b.id==='onlyFav')document.getElementById('results').innerHTML=list(visible().filter(s=>favorites.has(s.id)));else if(b.id==='allSongs')document.getElementById('results').innerHTML=list(visible());else if(b.dataset.review){const {error}=await sb.rpc('melodya_review',{song_id:b.dataset.review,decision:b.dataset.decision});if(error)throw error;await refresh()}else if(b.dataset.delete){const s=songs.find(s=>s.id===b.dataset.delete);if(!s||!confirm('Supprimer ce titre ?'))return;const {error}=await sb.from('melodya_songs').delete().eq('id',s.id);if(error)throw error;const paths=[s.audio_path,s.video_path].filter(Boolean);if(paths.length)await sb.storage.from('melodya-media').remove(paths);if(current===s.id){audio.pause();audio.removeAttribute('src');current=null;resetPlayback()}await refresh()}}catch(err){msg(err)}});
main.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;document.getElementById('results').innerHTML=list(visible().filter(s=>(s.title+' '+s.artist).toLowerCase().includes(search.toLowerCase())))}});
main.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,button=e.submitter;if(f.id==='login'){const email=f.elements.email.value.trim(),password=f.elements.password.value,signup=button?.value==='signup';try{const {data,error}=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(error)throw error;if(signup&&!data.session){alert('Compte créé. Confirme ton adresse email puis connecte-toi.')}else{session=data.session;const r=await sb.rpc('melodya_is_admin');isAdmin=r.data===true;tab='home';await refresh()}}catch(err){msg(err)}}else if(f.id==='upload'){if(!session)return;const submit=f.querySelector('button[type=submit]');submit.disabled=true;submit.textContent='Envoi en cours…';let paths=[];try{const fd=new FormData(f),file=fd.get('file'),video=fd.get('video');if(!file?.size||!file.type.startsWith('audio/'))throw Error('Sélectionne un fichier audio valide.');if(video?.size&&!['video/mp4','video/webm'].includes(video.type))throw Error('Clip MP4 ou WebM uniquement.');const audio_path=await uploadFile(file,session.user.id);paths.push(audio_path);const video_path=video?.size?await uploadFile(video,session.user.id):null;if(video_path)paths.push(video_path);const {error}=await sb.from('melodya_songs').insert({owner_id:session.user.id,title:String(fd.get('title')).trim(),artist:String(fd.get('artist')).trim(),audio_path,video_path,lyrics:String(fd.get('lyrics')||''),kids:fd.has('kids')});if(error)throw error;alert('Titre envoyé ! En attente de validation.');await refresh()}catch(err){if(paths.length)await sb.storage.from('melodya-media').remove(paths);msg(err)}finally{submit.disabled=false;submit.textContent='Envoyer à la modération'}}});
function next(dir){const rows=visible();if(!rows.length)return;const i=rows.findIndex(s=>s.id===current);play(rows[(i+dir+rows.length)%rows.length].id)}document.getElementById('prev').onclick=()=>next(-1);document.getElementById('next').onclick=()=>next(1);audio.addEventListener('ended',()=>next(1));
audio.addEventListener('timeupdate',async()=>{if(!current||audio.paused||audio.seeking||audio.readyState<2||countedSong===current)return;const pos=audio.currentTime;if(lastPosition!==null){const delta=pos-lastPosition;if(delta>0&&delta<=2.5)playedSeconds+=delta}lastPosition=pos;if(playedSeconds>=30){const id=current;countedSong=id;try{const {data,error}=await sb.rpc('melodya_record_play',{p_song_id:id});if(error)throw error;if(data){await loadCounts();render();if(session){await loadStats();render()}}}catch(err){console.warn('Écoute non enregistrée',err)}}});
audio.addEventListener('seeking',()=>{lastPosition=null});audio.addEventListener('pause',()=>{lastPosition=null});
sb.auth.onAuthStateChange((_event,s)=>{session=s});init();
</script></body></html>
