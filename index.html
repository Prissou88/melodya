<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#130e21"><title>MÉLODYA 0.2 • Prototype local</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#f8f4ff;background:#100d19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#32204c,#100d19 60%);min-height:100vh}header{max-width:1050px;margin:auto;padding:22px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:850;letter-spacing:2px}.brand span{color:#bc8afc}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;color:white;background:#382b50}button:hover{background:#50376d}button.primary{background:#9858ed;color:#fff;font-weight:700}button:disabled{opacity:.4;cursor:default}.layout{max-width:1050px;margin:auto;padding:0 16px 130px;display:grid;grid-template-columns:210px 1fr;gap:20px}.side,.panel{background:#1b1529;border:1px solid #3c2c52;border-radius:19px;padding:16px}.side{align-self:start;display:grid;gap:7px}.side button{text-align:left;background:transparent}.side button.active{background:#58387d}.panel{min-height:480px}.hero{border-radius:18px;background:linear-gradient(110deg,#7040b1,#261b41);padding:26px;margin-bottom:20px}h1{font-size:28px;margin:0 0 8px}h2{font-size:21px;margin:8px 0 15px}p{color:#c9bdd8;line-height:1.5}.tag{font-size:12px;color:#d9c4f2}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#282038;border-radius:14px;padding:16px}.cover{height:115px;background:linear-gradient(135deg,#563180,#c264c6);display:grid;place-items:center;font-size:46px;border-radius:12px;margin-bottom:12px}.title{font-weight:750}.muted{color:#b9a9cd;font-size:13px}.track{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #3c2c52}.track .details{flex:1;min-width:0}.track button{padding:8px 11px}.pill{display:inline-block;border-radius:50px;padding:5px 10px;background:#3d2b56;color:#e6d6fa;font-size:12px}.player{position:fixed;bottom:0;left:0;right:0;background:#20182f;border-top:1px solid #644784;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;z-index:10}.player strong{min-width:150px}.player audio{max-width:360px;width:100%;height:36px}input[type=text],input[type=file],textarea{width:100%;padding:12px;border:1px solid #604775;border-radius:10px;background:#251b37;color:#fff;margin:7px 0 12px}label{display:block;margin-top:8px}.notice{background:#30223f;border-left:3px solid #c58bff;padding:13px;border-radius:8px;margin:14px 0}.status{font-size:12px;color:#e7c5ff}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:650px){.layout{display:block}.side{display:flex;overflow:auto;margin-bottom:12px;padding:8px}.side button{white-space:nowrap}.panel{padding:14px}.player{gap:8px}.player strong{min-width:0;font-size:12px}.player audio{width:calc(100% - 80px)}.brand{font-size:21px}}

textarea{min-height:110px;resize:vertical}select{padding:11px;background:#251b37;color:white;border:1px solid #604775;border-radius:10px} .lyrics{white-space:pre-wrap;line-height:1.9;background:#2c2140;border-radius:14px;padding:18px;max-height:240px;overflow:auto}.badge{font-size:11px;background:#4b315d;padding:4px 8px;border-radius:30px}.switch{display:flex;align-items:center;gap:9px}.switch input{width:auto}.video{width:100%;max-height:350px;border-radius:12px;background:#09060e} .hint{font-size:12px;color:#d0b9e5}</style></head><body><header><div class="brand">♫ MÉLO<span>DYA</span></div><span class="pill">v0.2 · Gratuit · Sans pub</span></header><div class="layout"><nav class="side" id="nav"><button data-tab="home" class="active">⌂ Accueil</button><button data-tab="library">♫ Bibliothèque</button><button data-tab="artist">♬ Studio artiste</button><button data-tab="admin">♛ Modération</button><button data-tab="about">ⓘ Projet</button></nav><main class="panel" id="main"></main></div><footer class="player"><strong id="now">Aucune chanson</strong><button id="prev" title="Précédent">⏮</button><audio id="audio" controls preload="metadata"></audio><button id="next" title="Suivant">⏭</button></footer><script>
'use strict';
const main=document.getElementById('main'),audio=document.getElementById('audio');
let tab='home',kids=false,search='',favorites=new Set(),submissions=[],current=null,activeUrl=null,db=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?.()||String(Date.now())+Math.random();
const statusLabel={pending:'En attente',approved:'Approuvée',rejected:'Refusée'};
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('melodya-local-v02',1);r.onupgradeneeded=()=>{r.result.createObjectStore('songs',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(){return new Promise((resolve,reject)=>{let r=db.transaction('songs').objectStore('songs').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(song){return new Promise((resolve,reject)=>{let r=db.transaction('songs','readwrite').objectStore('songs').put(song);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function del(id){return new Promise((resolve,reject)=>{let r=db.transaction('songs','readwrite').objectStore('songs').delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function available(){return submissions.filter(s=>s.status==='approved'&&(!kids||s.kids))}
function list(songs){return songs.length?songs.map(s=>`<div class="track"><div style="font-size:25px">${s.video?'▣':'♫'}</div><div class="details"><div class="title">${esc(s.title)}</div><div class="muted">${esc(s.artist)} ${s.kids?'· Déclaré tout public':''} ${s.video?'· Clip':''}</div></div><button data-play="${esc(s.id)}" aria-label="Écouter">▶</button><button data-fav="${esc(s.id)}" aria-label="Favori">${favorites.has(s.id)?'♥':'♡'}</button></div>`).join(''):'<p>Aucune chanson pour le moment.</p>'}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let published=available();
if(tab==='home')main.innerHTML=`<section class="hero"><h1>Bienvenue sur MÉLODYA 💜</h1><p>Des artistes indépendants, de la musique et des clips, gratuitement et sans publicité.</p><button class="primary" data-goto="artist">Publier un titre</button></section><div class="actions"><button id="kid">${kids?'✓ Mode enfant (démo)':'♧ Activer le mode enfant (démo)'}</button><span class="pill">${published.length} titre(s) disponibles</span></div><h2>Découvrir</h2>${list(published)}`;
else if(tab==='library')main.innerHTML=`<h1>Bibliothèque</h1><input type="text" id="search" placeholder="Rechercher titre ou artiste" value="${esc(search)}"><div class="actions"><button id="onlyFav">♥ Favoris</button><button id="allSongs">Toutes les chansons</button></div><div id="results">${list(published.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(search.toLowerCase())))}</div>`;
else if(tab==='artist')main.innerHTML=`<h1>Studio artiste</h1><p>Ajoute un morceau depuis ton appareil. Il sera enregistré localement puis soumis à validation.</p><form id="upload"><label>Titre<input name="title" type="text" maxlength="100" required placeholder="Titre du morceau"></label><label>Nom d'artiste<input name="artist" type="text" maxlength="100" required placeholder="Nom de l'artiste"></label><label>Fichier audio (MP3, M4A, WAV…)<input name="file" type="file" accept="audio/*" required></label><label>Clip facultatif (MP4, WebM)<input name="video" type="file" accept="video/mp4,video/webm"></label><label>Paroles facultatives<textarea name="lyrics" maxlength="15000" placeholder="Colle ici les paroles que tu as le droit de diffuser"></textarea></label><label class="switch"><input type="checkbox" name="kids"> Convient aux enfants (déclaration à vérifier)</label><label class="switch"><input type="checkbox" name="rights" required> Je déclare posséder les droits nécessaires sur l'audio, la vidéo et les paroles.</label><button class="primary" type="submit">Envoyer à la modération locale</button></form><div class="notice">Fichiers conservés dans ce navigateur via IndexedDB, selon l'espace disponible. Rien n'est publié sur Internet. Taille conseillée : moins de 30 Mo par fichier.</div><h2>Mes soumissions</h2>${submissions.length?submissions.map(s=>`<div class="track"><div class="details"><strong>${esc(s.title)}</strong><div class="muted">${esc(s.artist)} · ${statusLabel[s.status]}</div></div><button data-delete="${esc(s.id)}">Supprimer</button></div>`).join(''):'<p>Aucune soumission.</p>'}`;
else if(tab==='admin')main.innerHTML=`<h1>Modération ♛</h1><div class="notice">Démo non sécurisée : aucun vrai compte ni contrôle d'accès. Ne publie pas cette page comme service public.</div><div class="cards"><div class="card"><h2>${submissions.filter(s=>s.status==='pending').length}</h2>En attente</div><div class="card"><h2>${submissions.filter(s=>s.status==='approved').length}</h2>Acceptés</div><div class="card"><h2>${submissions.filter(s=>s.status==='rejected').length}</h2>Refusés</div></div><h2>Publications à examiner</h2>${submissions.filter(s=>s.status==='pending').map(s=>`<div class="track"><div class="details"><strong>${esc(s.title)}</strong><div class="muted">${esc(s.artist)} · ${s.video?'Clip joint · ':''}${s.lyrics?'Paroles jointes · ':''}${s.kids?'Déclaré enfant':'Non classé enfant'}</div></div><button data-review="${esc(s.id)}" data-decision="approved">✓</button><button data-review="${esc(s.id)}" data-decision="rejected">✕</button></div>`).join('')||'<p>Aucun titre en attente.</p>'}<h2>Publications traitées</h2>${submissions.filter(s=>s.status!=='pending').map(s=>`<div class="track"><div class="details"><strong>${esc(s.title)}</strong><div class="muted">${statusLabel[s.status]}</div></div><button data-review="${esc(s.id)}" data-decision="pending">Réexaminer</button></div>`).join('')||'<p>Aucune.</p>'}`;
else main.innerHTML=`<h1>À propos de MÉLODYA 0.2</h1><p>Prototype local et gratuit. Tu peux déposer, conserver, approuver, lire et supprimer des fichiers audio. Clips et paroles peuvent être joints aux titres.</p><div class="notice">Les données restent sur cet appareil et dans ce navigateur. Vider les données du navigateur peut supprimer les morceaux. Aucun vrai compte artiste, don, partage public, synchronisation, protection parentale ou accès administrateur sécurisé.</div><p>Prochaine étape : hébergement, comptes authentifiés, stockage serveur, autorisations musicales et règles de sécurité des mineurs.</p><button id="export">Exporter les métadonnées (JSON)</button>`;
}
async function play(id){let s=submissions.find(x=>x.id===id&&x.status==='approved');if(!s)return;if(kids&&!s.kids)return alert('Ce titre n’est pas classé pour le mode enfant.');if(activeUrl)URL.revokeObjectURL(activeUrl);activeUrl=URL.createObjectURL(s.file);current=s.id;audio.src=activeUrl;document.getElementById('now').textContent=s.title+' · '+s.artist;audio.play().catch(()=>{});if(s.lyrics||s.video){let old=document.getElementById('extras');if(old)old.remove();let block=document.createElement('section');block.id='extras';block.className='notice';block.innerHTML=`<h2>En lecture : ${esc(s.title)}</h2>${s.video?'<p>Clip joint :</p><video class="video" controls playsinline id="clip"></video>':''}${s.lyrics?`<h3>Paroles</h3><div class="lyrics">${esc(s.lyrics)}</div>`:''}`;main.prepend(block);if(s.video){let v=block.querySelector('video');v.src=URL.createObjectURL(s.video);v.onloadeddata=()=>{};v.addEventListener('emptied',()=>URL.revokeObjectURL(v.src),{once:true})}}}
async function refresh(){submissions=await all();render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;search='';render()}});
main.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.goto){tab=b.dataset.goto;render()}else if(b.id==='kid'){kids=!kids;if(kids&&current){let s=submissions.find(s=>s.id===current);if(s&&!s.kids){audio.pause();audio.removeAttribute('src');current=null;document.getElementById('now').textContent='Aucune chanson'}}render()}else if(b.dataset.play)play(b.dataset.play);else if(b.dataset.fav){favorites.has(b.dataset.fav)?favorites.delete(b.dataset.fav):favorites.add(b.dataset.fav);localStorage.setItem('melodya-favs',JSON.stringify([...favorites]));render()}else if(b.id==='onlyFav')document.getElementById('results').innerHTML=list(available().filter(s=>favorites.has(s.id)));else if(b.id==='allSongs')document.getElementById('results').innerHTML=list(available());else if(b.dataset.review){let s=submissions.find(x=>x.id===b.dataset.review);if(s){s.status=b.dataset.decision;await put(s);await refresh()}}else if(b.dataset.delete){if(confirm('Supprimer définitivement ce titre de ce navigateur ?')){await del(b.dataset.delete);favorites.delete(b.dataset.delete);if(current===b.dataset.delete){audio.pause();audio.removeAttribute('src');current=null}await refresh()}}else if(b.id==='export'){let metadata=submissions.map(({id,title,artist,kids,status,lyrics,video})=>({id,title,artist,kids,status,lyrics,hasClip:!!video}));let u=URL.createObjectURL(new Blob([JSON.stringify(metadata,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='melodya-metadonnees.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});
main.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;document.getElementById('results').innerHTML=list(available().filter(s=>(s.title+' '+s.artist).toLowerCase().includes(search.toLowerCase())))}});
main.addEventListener('submit',async e=>{if(e.target.id!=='upload')return;e.preventDefault();let f=e.target,fd=new FormData(f),file=fd.get('file'),video=fd.get('video');if(!(file instanceof File)||!file.size||(!file.type.startsWith('audio/')&&!/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(file.name)))return alert('Sélectionne un fichier audio valide.');if(file.size>30*1024*1024)return alert('Audio trop volumineux pour cette démo (maximum 30 Mo).');if(video?.size>30*1024*1024)return alert('Clip trop volumineux pour cette démo (maximum 30 Mo).');if(video?.size&&!(/^(video\/mp4|video\/webm)$/.test(video.type)||/\.(mp4|webm)$/i.test(video.name)))return alert('Clip MP4 ou WebM uniquement.');let s={id:uid(),title:String(fd.get('title')).trim(),artist:String(fd.get('artist')).trim(),kids:fd.has('kids'),lyrics:String(fd.get('lyrics')||''),file,video:video?.size?video:null,status:'pending'};try{await put(s);await refresh();alert('Titre enregistré localement ! Tu peux le valider dans Modération.')}catch(err){alert('Stockage impossible : espace insuffisant ou navigateur non compatible. '+err.message)}});
function next(dir){let songs=available();if(!songs.length)return;let i=songs.findIndex(s=>s.id===current);play(songs[(i+dir+songs.length)%songs.length].id)}document.getElementById('prev').onclick=()=>next(-1);document.getElementById('next').onclick=()=>next(1);audio.addEventListener('ended',()=>next(1));
(async()=>{try{db=await openDB();favorites=new Set(JSON.parse(localStorage.getItem('melodya-favs')||'[]'));await refresh()}catch(err){main.innerHTML='<h1>Stockage indisponible</h1><p>Ouvre MÉLODYA dans un navigateur qui autorise IndexedDB. Le mode de navigation privée ou l’ouverture directe du fichier peut bloquer le stockage.</p><p>'+esc(err.message)+'</p>'}})();
</script></body></html>
